<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram 文件分享机器人控制中心</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <!-- Auth Screen -->
  <div id="login-modal" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">🤖</div>
        <h1 id="auth-title">租户控制中心</h1>
        <p id="auth-subtitle" class="text-muted">登录或注册您的专属 Telegram 文件分享机器人</p>
      </div>

      <!-- Tenant Login / Register Switch Tabs (Hidden on Admin Path) -->
      <div id="tenant-auth-tabs" class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login" onclick="window.FSB.switchAuthTab('login')">租户登录</button>
        <button type="button" id="register-tab-btn" class="auth-tab" data-mode="register" onclick="window.FSB.switchAuthTab('register')">新用户注册</button>
      </div>

      <!-- Login Form (Used for Tenant Login on / and Admin Login on /{admin_path}) -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label id="login-id-label" for="login-username">租户账号标识 (Slug)</label>
          <input type="text" id="login-username" class="form-control" placeholder="请输入账号标识" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="login-password">登录密码</label>
          <input type="password" id="login-password" class="form-control" placeholder="请输入登录密码" required autocomplete="current-password" />
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">立即登录</button>
      </form>

      <!-- Tenant Self-Registration Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-slug">租户账号标识 (登录账号) *</label>
          <input type="text" id="reg-slug" class="form-control" placeholder="2-32位字母/数字/下划线，如 mybot" required />
        </div>
        <div class="form-group">
          <label for="reg-display-name">租户显示名称</label>
          <input type="text" id="reg-display-name" class="form-control" placeholder="例如：我的资源分享机器人（选填）" />
        </div>
        <div class="form-group">
          <label for="reg-password">设置登录密码 *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="至少 4 位字符" required />
        </div>
        <div id="reg-invite-group" class="form-group hidden">
          <label for="reg-invite-code">注册邀请码 *</label>
          <input type="text" id="reg-invite-code" class="form-control" placeholder="请输入管理员提供的注册邀请码" />
        </div>
        <div class="form-divider"><span>机器人核心参数（可注册后在后台随时配置）</span></div>
        <div class="form-group">
          <label for="reg-bot-token">Telegram Bot Token（选填）</label>
          <input type="text" id="reg-bot-token" class="form-control" placeholder="123456789:AAH..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-owner-id">Owner Telegram ID（选填）</label>
            <input type="number" id="reg-owner-id" class="form-control" placeholder="例如 123456789" />
          </div>
          <div class="form-group">
            <label for="reg-db-channel">存储频道 ID（选填）</label>
            <input type="number" id="reg-db-channel" class="form-control" placeholder="例如 -1001234567890" />
          </div>
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary btn-block">立即注册并进入后台</button>
      </form>
    </div>
  </div>

  <!-- Main Application Shell -->
  <div id="app-container" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">⚡</span>
        <div class="sidebar-title-wrap">
          <div id="sidebar-brand" class="sidebar-brand">机器人控制台</div>
          <div id="sidebar-role-badge" class="badge badge-info">租户</div>
        </div>
      </div>

      <!-- Admin Tenant Switcher (Shown only when logged in as Platform Admin) -->
      <div id="admin-tenant-switcher-box" class="tenant-switcher-box hidden">
        <label class="switcher-label">当前管理租户</label>
        <select id="admin-tenant-select" class="form-control form-control-sm" onchange="window.FSB.onAdminTenantSelect(this.value)">
          <option value="">-- 请选择租户 --</option>
        </select>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary btn-block" onclick="window.FSB.logout()">退出登录</button>
      </div>
    </aside>

    <main class="main-area">
      <header id="top-header" class="top-header">
        <div class="header-left">
          <h2 id="page-title" class="page-title">数据概览</h2>
          <span id="current-tenant-indicator" class="badge badge-secondary hidden"></span>
        </div>
        <div class="header-right" id="header-actions"></div>
      </header>

      <section id="page-content" class="page-content"></section>
    </main>
  </div>

  <!-- Reusable Modal -->
  <div id="modal-container" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title">提示</h3>
        <button type="button" class="modal-close" onclick="window.FSB.closeModal()">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script src="/static/js/core.js"></script>
  <script src="/static/js/tenant.js"></script>
  <script src="/static/js/platform.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
