x-app: &app
  image: ${IMAGE:?Set IMAGE to the immutable production image tag}
  restart: unless-stopped
  env_file:
    - .env
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=${TMPFS_SIZE:-256m}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  web:
    <<: *app
    environment:
      PROCESS_ROLE: web
      PORT: "7860"
    ports:
      - "${WEB_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app
    environment:
      PROCESS_ROLE: worker
    stop_grace_period: 45s
