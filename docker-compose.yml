services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESS_ROLE: web
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/filesharing}
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-7860}/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/filesharing}
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 45s

  mongo:
    image: mongo:6.0.28-jammy
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
